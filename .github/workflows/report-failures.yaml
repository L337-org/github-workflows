name: 'Report failures'

# Posts a failed run of a workflow named below, started by one of the events below, to Slack
# through this repository's own reporter on the default branch (README.md).
on:
  workflow_run:
    workflows:
      - 'Check inbound changes'
      - 'Code review'
      - 'Announce pull requests'
    types: [completed]

permissions:
  # Both read by the reporter, which GitHub refuses to start without them.
  actions: read
  contents: read

jobs:
  slack:
    name: Report to Slack
    uses: ./.github/workflows/slack-on-failure.yaml
    with:
      channel: '#l337-org'
      events: '["schedule", "push", "release", "pull_request"]'
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
