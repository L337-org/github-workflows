name: 'Check inbound changes'
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  action-pins:
    # This repository's own action, from this commit, so a change to it is tested by the pull
    # request that makes it.  `actions/` holds the composite actions, whose `uses:` steps need
    # the same pins as any workflow's.
    runs-on: [ubuntu-latest]
    name: Action pin check
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pins hold
        uses: ./actions/action-pins
        with:
          directories: '.github/workflows actions'

  actionlint:
    # The workflows and actions here run in other repositories' CI, where a mistake fails a build
    # that has nothing to do with it, so they are linted before they get there.
    runs-on: [ubuntu-latest]
    name: actionlint
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Workflows lint clean
        # SC2016 is shellcheck noting that `$x` does not expand inside single quotes.  Here that
        # is always Markdown backticks in a printf format, which is the intent.
        run: uvx --from actionlint-py==1.7.12.25 actionlint -ignore 'SC2016'

  shared-behaviour:
    # What the Slack workflows do on a refusal, a fork or a draft cannot be made to happen from a
    # pull request here, the action-pins check needs references this repository does not
    # contain, and apt-install's retries need a mirror that fails, so each is run against
    # stand-ins and sample input instead.
    runs-on: [ubuntu-latest]
    name: Shared workflows and actions behave
    timeout-minutes: 5
    env:
      # The tests import the hygiene script, and a checkout is left as it was found.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Tests pass
        run: uvx --with pyyaml==6.0.3 pytest==8.3.5 -p no:cacheprovider -q tests

  apt-install:
    # This repository's own action, from this commit, on a runner: what the tests' stand-ins
    # cannot show - real apt, the archive directory's ownership, and the cache.  Two calls in one
    # job, the second with its packages one to a line, each keeping its own files.
    runs-on: [ubuntu-latest]
    name: apt-install installs
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install one package
        id: first
        uses: ./actions/apt-install
        with:
          packages: sl

      - name: Install another, one to a line
        uses: ./actions/apt-install
        with:
          packages: |
            figlet

      - name: Both are installed, and each call kept its own files
        run: |
          dpkg -s sl figlet >/dev/null
          shopt -s nullglob
          for package in sl figlet; do
            files=(/var/cache/apt/apt-install/*/"${package}"_*.deb)
            if (( ${#files[@]} != 1 )); then
              echo "::error::expected one cached ${package} file, found ${#files[@]}: ${files[*]}" >&2
              exit 1
            fi
          done
          dirs=(/var/cache/apt/apt-install/*/)
          if (( ${#dirs[@]} != 2 )); then
            echo "::error::expected an archive directory per call, found ${#dirs[@]}: ${dirs[*]}" >&2
            exit 1
          fi
