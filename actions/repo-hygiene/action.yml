name: 'Repository hygiene'
description: 'Check the conventions every repository in the organisation shares, over the checked-out repository.'

# Run after actions/checkout in the calling job, which keeps its own timeout-minutes.  The script
# is this action's copy at the version the caller names, so every repository on one version
# runs the same checks.
inputs:
  path:
    description: 'The repository to check.  Empty means the workspace the caller checked out.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        # The script pins its own dependencies, inline, and lives in this action's directory,
        # not the caller's workspace, where setup-uv would otherwise look and find nothing: a
        # warning on every caller's run that the cache is never invalidated.  setup-uv hashes
        # files outside the workspace too.
        cache-dependency-glob: ${{ github.action_path }}/check-repo-hygiene.py

    - name: Repository conventions hold
      shell: bash
      env:
        REPOSITORY_PATH: ${{ inputs.path }}
      run: uv run --script "$GITHUB_ACTION_PATH/check-repo-hygiene.py" "${REPOSITORY_PATH:-$GITHUB_WORKSPACE}"
