name: 'Action pin check'
description: 'Fail when any `uses:` in the checked-out repository names something other than a full 40-hex commit SHA, or a version tag of L337-org/github-workflows.'

# A tag or branch ref can be repointed by the action's owner at any time, so `@v7` means CI runs
# whatever that owner last pushed to it.  First-party actions/* are not exempt (DS.6.1):
# Dependabot bumps the SHA and rewrites the trailing "# vX.Y.Z" comment, so the pin costs nothing
# to hold.  Local actions and workflows (./...) are exempt - they are the repository's own code
# at the same commit.  A job-level `uses:` calling another repository's reusable workflow is a
# `uses:` like any other and needs the same pin.
#
# The one exception is L337-org/github-workflows at a version tag, such as `@v2` (DS.6.2).  It
# holds only while a ruleset there blocks creating, moving and deleting `v*` tags with a bypass
# list no wider than its main branch's, so that moving one takes the same people as merging; a
# breaking change goes to a new major tag while callers stay on the old one.  It is named
# exactly rather than as the organisation, because the exemption rests on that ruleset, which
# another repository may not have.
#
# Quoted and upper-case SHAs are accepted because they are equally pinned, and the trailing
# version comment is not enforced (DS.6.3): a guard that fails a legitimate pin for a cosmetic
# reason is one somebody eventually switches off wholesale.
inputs:
  directories:
    description: 'Space-separated directories to search, relative to the workspace.  A missing one is skipped.'
    required: false
    default: '.github/workflows .github/actions'

runs:
  using: composite
  steps:
    - name: Every `uses:` must name a 40-hex commit SHA or a protected version tag
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        DIRECTORIES: ${{ inputs.directories }}
      run: |
        read -ra dirs <<<"$DIRECTORIES"
        present=()
        for d in "${dirs[@]}"; do
          if [ -d "$d" ]; then present+=("$d"); else echo "Skipped $d: not present."; fi
        done
        if [ "${#present[@]}" -eq 0 ]; then
          # Nothing searched is not the same answer as nothing wrong.
          echo "::error::None of the directories to search exist: $DIRECTORIES" >&2
          exit 1
        fi
        bad=$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' "${present[@]}" \
              | grep -vE "uses:[[:space:]]*[\"']?\./" \
              | grep -vE "uses:[[:space:]]*[\"']?L337-org/github-workflows/[^[:space:]\"'@]+@v[0-9]+(\.[0-9]+){0,2}[\"']?([[:space:]]|\$)" \
              | grep -vE "uses:[[:space:]]*[\"']?[^[:space:]\"']+@[0-9a-fA-F]{40}[\"']?([[:space:]]|\$)" \
              || true)
        if [ -n "$bad" ]; then
          echo "::error::Every action must be pinned to a full 40-hex commit SHA, or for L337-org/github-workflows a version tag such as @v2." >&2
          printf '%s\n' "$bad" >&2
          exit 1
        fi
        echo "All action references in ${present[*]} are pinned to commit SHAs or protected version tags."
